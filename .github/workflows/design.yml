name: Design pipeline

on:
  push:
    paths:
      - "specs/**"
      - "profiles/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/design.yml"
  pull_request:
    paths:
      - "specs/**"
      - "profiles/**"
      - "schemas/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/design.yml"
  workflow_dispatch:
    inputs:
      spec:
        description: "Design spec to run (path under specs/)"
        required: false
        default: "specs/led-blinky.json"
        type: string
      schematic:
        description: "Optional KiCad schematic (repo-relative path)"
        required: false
        default: ""
        type: string
      netlist:
        description: "Optional KiCad netlist (repo-relative path)"
        required: false
        default: ""
        type: string
      ltspice:
        description: "Optional LTspice/SPICE netlist (repo-relative path)"
        required: false
        default: ""
        type: string
      pin_map:
        description: "Optional LTspice pin map JSON (repo-relative path)"
        required: false
        default: ""
        type: string
      node_aliases:
        description: "Optional LTspice node-alias JSON (repo-relative path)"
        required: false
        default: ""
        type: string
      board:
        description: "Optional existing board (repo-relative path); pair with skip_build"
        required: false
        default: ""
        type: string
      skip_build:
        description: "Skip the build stage"
        required: false
        default: false
        type: boolean
      skip_route:
        description: "Skip Freerouting"
        required: false
        default: false
        type: boolean
      skip_check:
        description: "Skip DRC/DFM/parity gates"
        required: false
        default: false
        type: boolean
      skip_fab:
        description: "Skip fabrication export"
        required: false
        default: false
        type: boolean
      allow_unverified:
        description: "Exit 0 even when the professional claim fails"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    name: Spec validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate every spec
        run: |
          set -euo pipefail
          shopt -s nullglob
          specs=(specs/*.json)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No specs found" >&2
            exit 1
          fi
          for spec in "${specs[@]}"; do
            echo "::group::validate ${spec}"
            python3 scripts/design_spec.py validate "${spec}"
            echo "::endgroup::"
          done

  design:
    name: Build, route, DRC and fab
    runs-on: ubuntu-latest
    needs: spec
    env:
      SPEC: ${{ github.event.inputs.spec || 'specs/led-blinky.json' }}
      SCHEMATIC: ${{ github.event.inputs.schematic }}
      NETLIST: ${{ github.event.inputs.netlist }}
      LTSPICE: ${{ github.event.inputs.ltspice }}
      PIN_MAP: ${{ github.event.inputs.pin_map }}
      NODE_ALIASES: ${{ github.event.inputs.node_aliases }}
      BOARD: ${{ github.event.inputs.board }}
      SKIP_BUILD: ${{ github.event.inputs.skip_build }}
      SKIP_ROUTE: ${{ github.event.inputs.skip_route }}
      SKIP_CHECK: ${{ github.event.inputs.skip_check }}
      SKIP_FAB: ${{ github.event.inputs.skip_fab }}
      ALLOW_UNVERIFIED: ${{ github.event.inputs.allow_unverified }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve inputs
        run: |
          set -euo pipefail
          SPEC="${SPEC:-specs/led-blinky.json}"
          case "$SPEC" in
            specs/*.json) ;;
            *) echo "::error::spec must be a path under specs/ (got: $SPEC)"; exit 1 ;;
          esac
          [ -f "$SPEC" ] || { echo "::error::spec not found: $SPEC"; exit 1; }
          for path in "$SCHEMATIC" "$NETLIST" "$LTSPICE" "$PIN_MAP" "$NODE_ALIASES" "$BOARD"; do
            if [ -n "$path" ] && [ ! -f "$path" ]; then
              echo "::error::input not found: $path"
              exit 1
            fi
          done
          echo "SPEC_NAME=$(basename "$SPEC" .json)" >> "$GITHUB_ENV"
          echo "Resolved spec: $SPEC"
      - name: Prepare writable output
        run: |
          mkdir -p build
          chmod -R 0777 build
          : > build/summary.md
          chmod 0666 build/summary.md
      - name: Run the KiCad 9 + Freerouting pipeline
        run: |
          set -euo pipefail
          docker run --rm --user root \
            -v "${PWD}:/work" -w /work \
            -e HOME=/tmp \
            -e GITHUB_ACTIONS \
            -e GITHUB_STEP_SUMMARY=/work/build/summary.md \
            -e SPEC -e SPEC_NAME -e SCHEMATIC -e NETLIST -e LTSPICE -e PIN_MAP -e NODE_ALIASES -e BOARD \
            -e SKIP_BUILD -e SKIP_ROUTE -e SKIP_CHECK -e SKIP_FAB -e ALLOW_UNVERIFIED \
            kicad/kicad:9.0 \
            bash -lc '
              set -euo pipefail
              apt-get update -qq
              apt-get install -y -qq curl ca-certificates >/dev/null

              # Freerouting 2.5.0 is built for Java 25. The KiCad image ships
              # Java-free, so install a pinned Adoptium JRE rather than relying
              # on the Debian default (Java 17).
              curl -fL -o /tmp/jre25.tar.gz \
                "https://api.adoptium.net/v3/binary/latest/25/ga/linux/x64/jre/hotspot/normal/eclipse"
              mkdir -p /opt/jre25
              tar -xzf /tmp/jre25.tar.gz -C /opt/jre25 --strip-components=1
              export PATH="/opt/jre25/bin:${PATH}"
              java -version

              curl -fL -o build/freerouting.jar \
                "https://github.com/freerouting/freerouting/releases/download/v2.5.0/freerouting-2.5.0.jar"

              if ! python3 -c "import pcbnew" 2>/dev/null; then
                PCB_DIR=$(dirname "$(find /usr -name pcbnew.py 2>/dev/null | head -1)")
                if [ -n "${PCB_DIR}" ] && [ -d "${PCB_DIR}" ]; then
                  export PYTHONPATH="${PCB_DIR}:${PYTHONPATH:-}"
                fi
              fi
              python3 -c "import pcbnew; print(\"pcbnew\", pcbnew.GetBuildVersion())"

              args=(all "$SPEC" -o "build/$SPEC_NAME" --freerouting-jar build/freerouting.jar --kicad-cli kicad-cli)
              if [ -n "${SCHEMATIC:-}" ]; then args+=(--schematic "$SCHEMATIC"); fi
              if [ -n "${NETLIST:-}" ]; then args+=(--netlist "$NETLIST"); fi
              if [ -n "${LTSPICE:-}" ]; then args+=(--ltspice "$LTSPICE" --no-ask); fi
              if [ -n "${PIN_MAP:-}" ]; then args+=(--pin-map "$PIN_MAP"); fi
              if [ -n "${NODE_ALIASES:-}" ]; then args+=(--node-aliases "$NODE_ALIASES"); fi
              if [ -n "${BOARD:-}" ]; then args+=(--board "$BOARD"); fi
              if [ "${SKIP_BUILD:-false}" = "true" ]; then args+=(--skip-build); fi
              if [ "${SKIP_ROUTE:-false}" = "true" ]; then args+=(--skip-route); fi
              if [ "${SKIP_CHECK:-false}" = "true" ]; then args+=(--skip-check); fi
              if [ "${SKIP_FAB:-false}" = "true" ]; then args+=(--skip-fab); fi
              if [ "${ALLOW_UNVERIFIED:-false}" = "true" ]; then args+=(--allow-unverified); fi

              python3 scripts/design_pipeline.py "${args[@]}"
            '
      - name: Publish design summary
        if: always()
        run: |
          if [ -f build/summary.md ]; then
            cat build/summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi
      - name: Upload design outputs
        if: always() && env.SPEC_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: design-output
          path: build/${{ env.SPEC_NAME }}/
          if-no-files-found: warn
      - name: Upload design report
        if: always() && env.SPEC_NAME != ''
        uses: actions/upload-artifact@v7
        with:
          name: design-report
          path: build/${{ env.SPEC_NAME }}/report/
          if-no-files-found: warn
